<script>
async function run() {
  try {
    console.log('=== PASSO 1: LOGIN ===');
    const loginResp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email: 'debug.temp.coord2@teste-interno.local', senha: 'DebugTemp2_8wQ!z3' })
    });
    const loginData = await loginResp.json();
    console.log('login status:', loginResp.status, JSON.stringify(loginData));

    console.log('=== PASSO 2: GET /api/nucleos/2 (como o frontend faz) ===');
    const nucResp = await fetch('/api/nucleos/2', { credentials: 'include' });

  }
}
run();
</script>
