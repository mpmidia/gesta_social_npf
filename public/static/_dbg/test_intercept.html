<!DOCTYPE html>
<html>
<head>
  <title>debug intercept</title>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body>
<iframe id="frame" src="about:blank" style="width:100%;height:600px;border:1px solid red;"></iframe>
<script>
async function run() {
  try {
    axios.defaults.withCredentials = true;
    await axios.post('/api/auth/login', { email: 'debug.temp.coord2@teste-interno.local', senha: 'DebugTemp2_8wQ!z3' });
    console.log('login OK');
    const frame = document.getElementById('frame');
    frame.onload = () => {
      try {
        const win = frame.contentWindow;
        // Intercepta o console.error do iframe para capturar o que o catch do router imprime
        const origError = win.console.error;
        win.console.error = function(...args) {
          console.log('[IFRAME console.error]', ...args.map(a => (a && a.stack) ? a.stack : JSON.stringify(a)));
          origError.apply(win.console, args);
        };
        // Patcheia o router para logar a excecao real antes do catch generico
        setTimeout(() => {
          win.location.hash = '#/nucleos/2';
          setTimeout(() => {
            const doc = frame.contentDocument;
            const content = doc.getElementById('page-content');
            console.log('PAGE CONTENT APOS HASH:', content ? content.innerHTML.slice(0,500) : 'nao achou');
          }, 2500);
        }, 1500);
      } catch (e) {
        console.error('ERRO SETUP IFRAME:', e.message);
      }
    };
    frame.src = '/dashboard';
  } catch (err) {
    console.error('ERRO LOGIN:', err.message);
  }
}
run();
</script>
</body>
</html>
