<!DOCTYPE html>
<html>
<head>
  <title>debug direct call</title>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body>
<iframe id="frame" src="about:blank" style="width:100%;height:600px;border:1px solid red;"></iframe>
<script>
async function run() {
  try {
    axios.defaults.withCredentials = true;
    await axios.post('/api/auth/login', { email: 'debug.temp.coord2@teste-interno.local', senha: 'DebugTemp2_8wQ!z3' });
    console.log('login OK');
    const frame = document.getElementById('frame');
    frame.onload = () => {
      setTimeout(async () => {
        try {
          const win = frame.contentWindow;
          console.log('chamando renderNucleoDetalhe(2) diretamente...');
          await win.renderNucleoDetalhe(2);
          console.log('renderNucleoDetalhe terminou SEM excecao');
        } catch (e) {
          console.log('EXCECAO CAPTURADA:', e.message);
          console.log('STACK:', e.stack);
        }
      }, 1500);
    };
    frame.src = '/dashboard';
  } catch (err) {
    console.error('ERRO LOGIN:', err.message);
  }
}
run();
</script>
</body>
</html>
