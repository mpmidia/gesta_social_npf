<!DOCTYPE html>
<html>
<head>
  <title>debug dom check</title>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body>
<iframe id="frame" src="about:blank" style="width:100%;height:600px;border:1px solid red;"></iframe>
<script>
window.onerror = function(msg, src, line, col, err) {
  console.error('GLOBAL ERROR:', msg, 'at', src, line + ':' + col, err ? err.stack : '');
};
async function run() {
  try {
    axios.defaults.withCredentials = true;
    await axios.post('/api/auth/login', { email: 'debug.temp.coord2@teste-interno.local', senha: 'DebugTemp2_8wQ!z3' });
    console.log('login OK');
    const frame = document.getElementById('frame');
    frame.onload = () => {
      setTimeout(() => {
        try {
          const doc = frame.contentDocument;
          const content = doc.getElementById('page-content');
          console.log('PAGE CONTENT HTML (primeiros 1000 chars):', content ? content.innerHTML.slice(0, 1000) : 'NAO ENCONTRADO #page-content');
          const title = doc.getElementById('page-title');
          console.log('PAGE TITLE:', title ? title.textContent : 'NAO ENCONTRADO');
        } catch (e) {
          console.error('ERRO AO LER IFRAME:', e.message);
        }
      }, 3000);
    };
    frame.src = '/dashboard#/nucleos/2';
  } catch (err) {
    console.error('ERRO LOGIN:', err.message);
  }
}
run();
</script>
</body>
</html>
